<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<title>auxpause hardware strobe: ETM counter drives TRCEXTOUT1, a PMU event pauses AUX</title>
<style>
.fg{fill:#1f2937}.mu{fill:#6b7280}
.box{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}
.ete{fill:#0f6b57;fill-opacity:.08;stroke:#0f6b57;stroke-width:1.5}
.pmu{fill:#c0701e;fill-opacity:.08;stroke:#c0701e;stroke-width:1.5}
.ar{stroke:#374151;stroke-width:1.8;fill:none;marker-end:url(#a)}
.arg{stroke:#0f6b57;stroke-width:2;fill:none;marker-end:url(#ag)}
.aro{stroke:#c0701e;stroke-width:2;fill:none;marker-end:url(#ao)}
.lab{font-size:14px}.sm{font-size:12.5px}.h{font-size:17px;font-weight:600}
.res{stroke:#c0701e;fill:none;stroke-width:2.2}.pau{stroke:#0f6b57;fill:none;stroke-width:2.2}
.rec{fill:#0f6b57;fill-opacity:.16;stroke:#0f6b57;stroke-width:1.5}
.gd{stroke:#9ca3af;stroke-width:1;stroke-dasharray:3 4}
.cnt{stroke:#374151;fill:none;stroke-width:1.8}
.rl{fill:#c0701e}.pl{fill:#0f6b57}
.br{stroke:#9ca3af;fill:none;stroke-width:1.2}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#374151"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f6b57"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c0701e"/></marker>
</defs>
<rect width="1200" height="700" fill="#ffffff"/>
<text class="h fg" x="20" y="30">auxpause: the ETM times the window, a PMU event pauses AUX and takes the sample</text>
<rect class="ete" x="20" y="50" width="700" height="210" rx="10"/>
<text class="lab pl" x="36" y="74" font-weight="600">ETE / ETMv4 (per CPU), programmed by cs_etm/auxpause,preset=N/</text>
<rect class="box" x="40" y="100" width="170" height="80" rx="6"/>
<text class="lab fg" x="54" y="126">Counter 1</text><text class="sm mu" x="54" y="146">counts allowed cycles</text><text class="sm mu" x="54" y="164">reload = W (RLDSELF)</text>
<rect class="box" x="260" y="100" width="170" height="80" rx="6"/>
<text class="lab fg" x="274" y="126">Resource sel. 4</text><text class="sm mu" x="274" y="146">GROUP=2: counter 1</text><text class="sm mu" x="274" y="164">at zero</text>
<rect class="box" x="480" y="100" width="100" height="80" rx="6"/>
<text class="lab fg" x="494" y="126">Event 1</text><text class="sm mu" x="494" y="146">TRCEVENTCTL0R</text>
<rect class="box" x="610" y="100" width="95" height="80" rx="6"/>
<text class="lab fg" x="620" y="126">EXTOUT1</text><text class="sm mu" x="620" y="146">fixed 1:1</text>
<path class="ar" d="M210 140 H258"/><path class="ar" d="M430 140 H478"/><path class="ar" d="M580 140 H608"/>
<text class="sm mu" x="40" y="210">Trace is prohibited at EL1 with /u (TRFCR_EL1), so the unit is paused in the kernel: W counts user cycles.</text>
<text class="sm mu" x="40" y="230">Counter 0 / selector 2 left for timestamp; event 0 avoided (trace trigger: TRBE driver treats TRBSR.TRG as fatal).</text>
<text class="sm mu" x="40" y="250">On every AUX resume the counter is written back to W while the unit is disabled (no carry-over from skid).</text>
<rect class="pmu" x="780" y="50" width="400" height="210" rx="10"/>
<text class="lab rl" x="796" y="74" font-weight="600">PMUv3 (per CPU)</text>
<rect class="box" x="800" y="95" width="360" height="62" rx="6"/>
<text class="lab fg" x="814" y="118">trcextout1 (0x4011), aux-action=pause, period=1</text>
<text class="sm mu" x="814" y="140">each pulse overflows → PMI: pause AUX, take sample</text>
<rect class="box" x="800" y="175" width="360" height="62" rx="6"/>
<text class="lab fg" x="814" y="198">cpu_cycles, aux-action=resume, period=P</text>
<text class="sm mu" x="814" y="220">PMI: resume AUX (ETE re-enabled, fresh A-Sync)</text>
<path class="arg" d="M705 128 H798"/><text class="sm pl" x="712" y="120">pulse</text>
<path class="aro" d="M800 215 C 740 300, 180 300, 125 184"/>
<text class="sm rl" x="420" y="296">resume re-enables trace, counter restarts at W</text>
<text class="sm fg" x="780" y="285">Gate: MIDR ∈ {A520, X925, N2, N3, V2, V3} + PMCEID0_EL0[49]</text>
<text class="sm fg" x="780" y="303">+ ETM has ≥2 counters, ≥3 selector pairs, ≥2 events</text>
<text class="h fg" x="20" y="350">Timing</text>
<text class="lab rl" x="20" y="386">resume PMI</text>
<path class="res" d="M170 404 H260 V388 H272 V404 H1180"/>
<text class="lab fg" x="20" y="440">counter 1</text>
<path class="cnt" d="M170 424 H272 L520 456 L520 424 H1180"/>
<text class="sm mu" x="280" y="420">W</text><text class="sm mu" x="500" y="472">0</text>
<text class="lab pl" x="20" y="496">EXTOUT1 pulse</text>
<path class="pau" d="M170 510 H520 V494 H530 V510 H1180"/>
<text class="lab pl" x="20" y="550">pause PMI</text>
<path class="pau" d="M170 564 H700 V548 H712 V564 H1180"/>
<text class="lab mu" x="20" y="604">ETM trace</text>
<path class="pau" d="M170 620 H272 V602 H706 V620 H1180"/>
<rect class="rec" x="272" y="602" width="434" height="18"/>
<text class="sm fg" x="420" y="616">RECORDING</text>
<line class="gd" x1="272" y1="388" x2="272" y2="640"/><line class="gd" x1="520" y1="424" x2="520" y2="640"/><line class="gd" x1="706" y1="548" x2="706" y2="660"/>
<path class="br" d="M272 632 V638 H520 V632"/><text class="sm fg" x="380" y="654">W cycles</text>
<path class="br" d="M520 632 V638 H706 V632"/><text class="sm fg" x="540" y="654">skid ≈ 200 cycles</text>
<circle cx="706" cy="675" r="8" fill="#0f6b57"/><text class="sm fg" x="724" y="680">sample: IP + fp callchain (+ AUX snapshot); window ≈ W + skid</text>
</svg>
